hero:
  title_line_1: 空間を整える。
  title_line_2: 思考を
  title_emphasis: 整える。
  note: |-
    部屋は、あなたの思考の現れです。
    部屋を片付けることは、単に空間を整えるだけではありません。

    何を大切にしたいのか、どのように暮らしたいのか。
    自分自身と向き合うことで、少しずつ思考も整っていきます。

    また、心地よく整えられた空間は、日々の暮らしに余白を生み、
    心を穏やかにしてくれます。

    **Mind × Body × Space**

    思考、身体、そして私たちを取り巻く空間。
    それぞれは独立したものではなく、深くつながっています。

    空間を整えることから、あなたが本当に大切にしたいもの、
    心地よいと感じる暮らしを、一緒に探していきませんか。
  button: お話しする
