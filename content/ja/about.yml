masthead:
  eyebrow: 私のストーリー
  japanese: 暮らし · 生きることの美しさ
  heading: デザインは見ることを、ヨガは聴くことを教えてくれた。
portrait_alt: Kaori, lifestyle designer and yoga practitioner
portrait_caption: Kaori · ポートレート
story:
  eyebrow: 私について
  body: |-
    私は長年、ドイツとイタリアのラグジュアリーブランドで、キッチン、家具、インテリア、空間をデザインしてきました。比率が部屋を変えること、一つの誠実な素材が空間全体を静かにすること、暮らしの細部が一日をつくることを学びました。

    その後、リシケシへ渡り、伝統的なヨガ、プラーナヤーマ、瞑想、インド哲学を学びました。外の世界を整えることから、自分の内側に向き合うことへ。仕事の見方が変わった時間です。

    今は二つの学びを一つにして、女性が自分らしい人生をつくるお手伝いをしています。
  signature: Kaori
mindful:
  eyebrow: マインドフルな暮らし
  japanese: 呼吸 · 自分に戻る道
  heading: 自分のリズムに戻る。
  body: |-
    リシケシで学んだ伝統的なヨガ、プラーナヤーマ、瞑想、インド哲学は、日々の暮らしを見つめる視点につながっています。マインドフルネス、呼吸への気づき、身体への意識を、主な仕事である住まいの整理と既存の空間を使いやすくするためのサポートを補う要素として取り入れます。

    独立したヨガスタジオのサービス、医療行為、心理カウンセリングではありません。
  button: お問い合わせ
  side_notes:
    - 日々の暮らしの中の気づき
    - 呼吸と身体への意識
