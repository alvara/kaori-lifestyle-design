masthead:
  eyebrow: 大切にしていること
  japanese: 整える · バランスをつくる
  heading: 暮らしは、小さく美しい選択の積み重ね。
  lead: Mind、Body、Spaceが支え合うと、ウェルビーイングは管理するものではなくなります。いつもの一日に、自然になじんでいきます。
intro:
  eyebrow: 暮らしを広い視点で
  heading: 部屋だけではなく、生き方を整える。
  body: ライフスタイルデザインは、インテリアや整理だけではありません。大切にしたいこと、必要としていること、日々の選択を見つめ、自分らしい暮らしを形にしていく考え方です。
principles:
  mind_japanese: 心 · 今ここにいること
  mind: 気づき、振り返り、次へ進む前の小さな余白。
  body_japanese: 身体 · 生命力
  body: ヨガ、呼吸、休息を通して、自分の身体に戻ること。
  space_japanese: 空間 · 居場所
  space: これからの自分を支える、部屋と習慣をつくること。
