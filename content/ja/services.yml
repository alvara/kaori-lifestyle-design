masthead:
  eyebrow: サービス
  japanese: 暮らしの空間を整える
  heading: 今ある空間を、使いやすく。
intro:
  eyebrow: 現在ご提供していること
  body: 整理収納と、今ある住空間をより使いやすく整えることを中心にサポートします。マインドフルな暮らしの視点は、その実践を補うものとして取り入れています。
services:
  - name: 整理収納
    description: 持ち物の見直しや片付け、整理収納を通して、日々の空間をより使いやすく整えるお手伝いをします。
    examples:
      - クローゼットの整理
      - キッチンの整理
      - 収納の改善
      - 持ち物の見直しと整理
      - 今ある空間の使いやすさの改善
  - name: 空間と暮らしのコンサルティング
    description: |-
      20年以上のキッチン・インテリアデザインの経験を生かし、今ある住空間をよりよく活用するための実用的なアドバイスをお伝えします。

      機能性、使いやすさ、収納、動線、心地よさを大切にしています。

      全面的なインテリアデザインではありません。現在、総合的なインテリア設計、CAD図面、3Dプレゼンテーション、家具やインテリア全体の選定は行っていません。
    examples: []
  - name: マインドフルな暮らし
    description: |-
      マインドフルネス、呼吸への気づき、ヨガの視点、身体への意識を、日々の暮らしを補う要素として取り入れます。

      独立したヨガスタジオのサービス、医療行為、心理カウンセリングではありません。
    examples: []
pricing:
  eyebrow: 詳細について
  heading: セッション料金。
  prices:
    - label: 1回（3時間）
      price: ¥39,600（税込）
    - label: 追加時間（30分）
      price: ¥6,600（税込）
    - label: 追加時間（1時間）
      price: ¥13,200（税込）
    - label: 交通費
      price: 実費
  explanation: |-
    3時間でどこまで進むかは、物の量やお部屋の状況、そしてお客様が一つひとつ向き合うペースによって異なります。

    無理のない範囲で進めたいので、まずは3時間を基本とし、その日の様子やご希望に応じて、延長や次回のセッションをご相談しましょう。

    延長は、必ず事前にお客様のご了承をいただいたうえで行います。
  button: はじめの一歩
