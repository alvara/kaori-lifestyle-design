story:
  eyebrow: A little about me
  body: |-
    For years, I designed kitchens, furniture, interiors, and spaces for German and Italian luxury brands. I learned how proportion changes a room, how one honest material can quiet a whole composition, and how the details we live with shape our days.

    Then I went to Rishikesh to study traditional yoga, pranayama, meditation, and Indian philosophy. There, my work shifted from arranging the world outside to meeting the one within.

    Today I bring both disciplines to one practice: helping women create lives that feel unmistakably like their own.
  signature: Kaori
mindful:
  eyebrow: Mindful Living
  japanese: 呼吸 · The way back
  heading: Come back to your own rhythm.
  body: |-
    My study of traditional yoga, pranayama, meditation, and Indian philosophy in Rishikesh informs my perspective on everyday living. Mindfulness, breathing awareness, and body awareness complement my main work in Home Organizing and improving the use of living spaces.

    This is not a standalone yoga studio service, medical treatment, or psychological counseling.
