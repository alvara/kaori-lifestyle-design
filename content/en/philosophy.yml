masthead:
  eyebrow: The philosophy
  japanese: 整える · To bring into balance
  heading: A life is a system of small, beautiful choices.
  lead: When mind, body, and space support one another, wellbeing stops being another thing to manage. It becomes part of an ordinary day.
intro:
  eyebrow: A wider view
  heading: Not just a room. A way of living.
  body: Lifestyle Design is not simply interior design or organizing. It is a way to look at how your values, needs, and everyday choices meet — and shape a life that feels more like your own.
principles:
  mind_japanese: 心 · presence
  mind: Awareness, reflection, and the generous pause before the next thing.
  body_japanese: 身体 · vitality
  body: Yoga, breath, and rest that bring you back to what is real and here.
  space_japanese: 空間 · belonging
  space: Rooms and rituals designed to hold the person you are becoming.
