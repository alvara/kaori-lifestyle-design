name: Deploy to GitHub Pages

# Every push to main rebuilds and republishes the site. Pages CMS edits
# are commits to main, so Kaori's saves go live through this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          # Project site lives at https://<owner>.github.io/<repo>/.
          # With a custom domain, set the repo variable BASE_PATH to "/"
          # and SITE_URL to the domain.
          SITE: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
